name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: Type Check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Tests
        run: php artisan test

  # 依存パッケージの既知の脆弱性を lock ファイルから検査する（install は不要）
  # composer: 深刻度に関係なく 1 件でもあれば失敗。abandoned（メンテ終了）は報告のみ
  # npm: high 以上で失敗（devDependencies も含む）
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Composer Audit
        run: composer audit --locked --abandoned=report

      - name: npm Audit
        run: npm audit --audit-level=high

  # ビルド済みアセット + php artisan serve + SQLite のシード済み DB で
  # Playwright のスモークテストを走らせる（サーバーは playwright.config.ts の webServer が起動する）
  e2e:
    runs-on: ubuntu-latest

    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          # シードのプレースホルダー画像を GD で生成する
          extensions: gd
          # setup-php は JIT を有効にするが、PHP 8.2 の JIT のバグで php artisan serve が segfault することがある
          # （#28 でレシピ詳細に Carbon の日付計算を足したら再現した）。開発用 Docker と同じく JIT は切る
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Prepare Database
        run: |
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan storage:link

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
