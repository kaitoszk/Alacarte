; レシピ投稿のバリデーションと揃える（StoreRecipeRequest / UpdateRecipeRequest）
; - 画像1枚: バリデーション 5MB に対し少し大きめにし、5MB 超過は Laravel の max ルールで日本語エラーにする
; - ファイル数: 完成写真1枚 + 手順画像合計20枚 = 21 に余裕を持たせる
; - リクエスト全体: 21 × 5MB + テキスト分。超過時は PostTooLargeException を画面のエラーに変換する
upload_max_filesize = 10M
post_max_size = 110M
max_file_uploads = 30
